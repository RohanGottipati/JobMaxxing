<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <h1 class="logo">Job Tracker</h1>
        <span id="app-count" class="count-chip"></span>
      </div>
      <div class="toolbar-right">
        <a id="link-website" href="../options/options.html" target="_blank" class="btn-text" title="Open the dashboard website" style="display:none">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.94 4.06a6.02 6.02 0 00-3.2 2.44h1.98c.24-.9.58-1.7.98-2.35a6.1 6.1 0 00.24-.09zM7.3 8.5c.05-.72.16-1.4.32-2H4.6a5.96 5.96 0 00-.55 2H7.3zm0 1H4.05c.08.71.27 1.38.55 2H7.6a13.6 13.6 0 01-.3-2zm1 0c.05.72.16 1.4.31 2h2.78c.15-.6.26-1.28.31-2H8.3zm3.4-1c-.05-.72-.16-1.4-.32-2H8.62c-.16.6-.27 1.28-.32 2h3.4zm1 1c-.05.72-.15 1.4-.3 2h2.99c.28-.62.47-1.29.55-2h-3.24zm2.56-3a6.02 6.02 0 00-3.2-2.44c.09.03.16.06.24.09.4.65.74 1.45.98 2.35h1.98zM10 4.24c-.44.5-.86 1.3-1.14 2.26h2.28C10.86 5.54 10.44 4.74 10 4.24zm0 11.52c.44-.5.86-1.3 1.14-2.26H8.86c.28.96.7 1.76 1.14 2.26zm-1.06.18a6.02 6.02 0 01-3.2-2.44h1.98c.24.9.58 1.7.98 2.35a6.1 6.1 0 01-.24.09h.48zm2.12 0h.48a6.1 6.1 0 01-.24-.09c.4-.65.74-1.45.98-2.35h1.98a6.02 6.02 0 01-3.2 2.44z" clip-rule="evenodd"/></svg>
          View Website
        </a>
        <button id="btn-signout" class="btn-text" title="Sign out" style="display:none">Sign out</button>
      </div>
    </header>

    <!-- Login gate (shown when logged out) -->
    <section id="login-view" class="login-view" style="display:none">
      <div class="login-hero">
        <div class="login-mark">JM</div>
        <h2 class="login-title">Welcome to JobMax</h2>
        <p class="login-sub">Log in to capture and track your job applications.</p>
      </div>

      <button id="btn-login-web" class="action-primary" title="Log in on the JobMaxxing website">
        <span class="action-primary-icon">
          <svg viewBox="0 0 20 20"><path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/><path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/></svg>
        </span>
        <span class="action-primary-text">
          <span class="action-primary-title">Log in with JobMaxxing</span>
          <span class="action-primary-sub">Opens the JobMaxxing login page</span>
        </span>
      </button>

      <div class="login-divider"><span>or use email</span></div>

      <div class="login-form">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password">
        </div>
        <div id="login-error" class="dupe-warning" style="display:none"></div>
        <button id="btn-login-email" class="btn-primary login-submit">Log in</button>
      </div>
    </section>

    <main id="home" style="display:none">
      <button id="btn-grab" class="action-primary" title="Capture the job posting on the current tab">
        <span class="action-primary-icon">
          <svg viewBox="0 0 20 20"><path d="M4 3a2 2 0 00-2 2v6a2 2 0 002 2h4v2H6a1 1 0 100 2h8a1 1 0 100-2h-2v-2h4a2 2 0 002-2V5a2 2 0 00-2-2H4zm6 2.5a.75.75 0 01.75.75v3.19l1.22-1.22a.75.75 0 111.06 1.06l-2.5 2.5a.75.75 0 01-1.06 0l-2.5-2.5a.75.75 0 111.06-1.06l1.22 1.22V6.25A.75.75 0 0110 5.5z"/></svg>
        </span>
        <span class="action-primary-text">
          <span class="action-primary-title">Grab This Page</span>
          <span class="action-primary-sub">Capture the job on the current tab</span>
        </span>
      </button>

      <div class="action-grid">
        <button id="btn-add" class="action-card" title="Add an application manually">
          <svg viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H3a1 1 0 110-2h6V3a1 1 0 011-1z"/></svg>
          <span>Add Manually</span>
        </button>
        <button id="btn-merge" class="action-card" title="Combine PDF files into one">
          <svg viewBox="0 0 20 20"><path d="M6 2a2 2 0 00-2 2v9a2 2 0 002 2h1v-2H6V4h5v3a1 1 0 001 1h3v1h2V6.414A1 1 0 0016.707 5.7L13.3 2.293A1 1 0 0012.586 2H6zm7 12v-2a1 1 0 10-2 0v2H9a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2z"/></svg>
          <span>Combine PDFs</span>
        </button>
      </div>
    </main>

    <!-- Slide-in form -->
    <div id="form-view" style="display:none" class="form-view">
      <div class="form-header">
        <button id="btn-back" class="btn-icon">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
        </button>
        <h2 id="form-title">Add Application</h2>
      </div>
      <div class="form-body">
        <input type="hidden" id="f-id">
        <div class="field">
          <label for="f-title">Job Title *</label>
          <input id="f-title" type="text" placeholder="Software Engineer" required>
        </div>
        <div class="field">
          <label for="f-company">Company *</label>
          <input id="f-company" type="text" placeholder="Acme Corp" required>
        </div>
        <div class="field">
          <label for="f-location">Location</label>
          <input id="f-location" type="text" placeholder="Remote / NYC">
        </div>
        <div class="field row">
          <div>
            <label for="f-date">Applied Date</label>
            <input id="f-date" type="date">
          </div>
          <div>
            <label for="f-status">Status</label>
            <select id="f-status">
              <option value="applied">Applied</option>
              <option value="oa">OA</option>
              <option value="interview">Interview</option>
              <option value="offer">Offer</option>
              <option value="rejected">Rejected</option>
              <option value="ghosted">Ghosted</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="f-season">Term</label>
          <select id="f-season">
            <option value="">— select term —</option>
          </select>
        </div>
        <div class="field">
          <label for="f-desc">Job Description</label>
          <textarea id="f-desc" rows="6" placeholder="Paste the job description…"></textarea>
        </div>
        <div class="field">
          <label for="f-notes">Notes</label>
          <textarea id="f-notes" rows="3" placeholder="Recruiter name, referral, etc."></textarea>
        </div>
        <div id="f-dupe" class="dupe-warning" style="display:none">
          ⚠ This looks like a duplicate of an existing application.
        </div>
      </div>
      <div class="form-footer">
        <button id="btn-delete" class="btn-danger" style="display:none">Delete</button>
        <button id="btn-save" class="btn-primary">Save</button>
      </div>
    </div>

    <!-- Slide-in: combine PDFs -->
    <div id="merge-view" style="display:none" class="form-view">
      <div class="form-header">
        <button id="btn-merge-back" class="btn-icon">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
        </button>
        <h2>Combine PDFs</h2>
      </div>
      <div class="form-body">
        <label id="merge-drop" class="merge-drop" for="merge-input">
          <svg viewBox="0 0 20 20"><path d="M10 3a1 1 0 011 1v6h6a1 1 0 110 2h-6v6a1 1 0 11-2 0v-6H3a1 1 0 110-2h6V4a1 1 0 011-1z" opacity="0"/><path d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm6 2.5a.75.75 0 01.75.75v3.19l1.22-1.22a.75.75 0 111.06 1.06l-2.5 2.5a.75.75 0 01-1.06 0l-2.5-2.5a.75.75 0 111.06-1.06l1.22 1.22V6.25A.75.75 0 0110 5.5z"/></svg>
          <span class="merge-drop-title">Click to choose PDFs</span>
          <span class="merge-drop-hint">or drop them here — add as many as you like</span>
          <input id="merge-input" type="file" accept="application/pdf" multiple hidden>
        </label>

        <ul id="merge-list" class="merge-list"></ul>

        <div class="field">
          <label for="merge-name">Output file name</label>
          <input id="merge-name" type="text" value="combined.pdf" autocomplete="off">
        </div>

        <div id="merge-status" class="merge-status" style="display:none"></div>
      </div>
      <div class="form-footer">
        <button id="btn-merge-clear" class="btn-danger" style="display:none">Clear</button>
        <button id="btn-merge-go" class="btn-primary" disabled>Combine &amp; Download</button>
      </div>
    </div>
  </div>
  <script src="../vendor/pdf-lib.min.js"></script>
  <script src="popup.js" type="module"></script>
</body>
</html>
